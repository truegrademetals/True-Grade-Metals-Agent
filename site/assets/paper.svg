<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Procedural paper stock: a fine pulp speckle plus a stretched fibre field.
       stitchTiles keeps it seamless when repeated. Deliberately near-threshold —
       it should register as tooth under the type, never as visible noise. -->
  <defs>
    <filter id="pulp" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" seed="11"
                    stitchTiles="stitch" result="grain"/>
      <feColorMatrix in="grain" type="matrix"
        values="0 0 0 0 0.078
                0 0 0 0 0.086
                0 0 0 0 0.094
                0.17 0 0 0 -0.072"/>
    </filter>

    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.42" numOctaves="2" seed="29"
                    stitchTiles="stitch" result="strands"/>
      <feColorMatrix in="strands" type="matrix"
        values="0 0 0 0 0.086
                0 0 0 0 0.090
                0 0 0 0 0.098
                0.10 0 0 0 -0.048"/>
    </filter>
  </defs>

  <rect width="240" height="240" filter="url(#fibre)"/>
  <rect width="240" height="240" filter="url(#pulp)"/>
</svg>
